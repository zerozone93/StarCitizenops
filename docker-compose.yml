services:
  postgres:
    image: postgres:16
    container_name: starcitizenops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: starcitizenops
    ports:
      - "5432:5432"
    volumes:
      - starcitizenops-postgres:/var/lib/postgresql/data

volumes:
  starcitizenops-postgres:
